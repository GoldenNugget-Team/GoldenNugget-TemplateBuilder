<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#E8A317"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#F25C05"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1DC"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#F0A500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A2E00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="215" fill="url(#rim)"/>
  <rect x="96" y="96" width="832" height="832" rx="170" fill="url(#face)"/>
  <g filter="url(#shadow)">
    <rect x="212" y="232" width="600" height="560" rx="84" fill="url(#card)"/>
  </g>
  <!-- switch, on -->
  <rect x="292" y="322" width="250" height="132" rx="66" fill="url(#gold)"/>
  <circle cx="476" cy="388" r="52" fill="#FFFFFF"/>
  <rect x="592" y="362" width="140" height="52" rx="26" fill="#F3D9B8"/>
  <!-- slider -->
  <rect x="292" y="560" width="440" height="40" rx="20" fill="#F3D9B8"/>
  <rect x="292" y="560" width="250" height="40" rx="20" fill="url(#gold)"/>
  <circle cx="542" cy="580" r="54" fill="#FFFFFF" stroke="#F0A500" stroke-width="16"/>
  <!-- third row: short text bars -->
  <rect x="292" y="680" width="200" height="36" rx="18" fill="#F3D9B8"/>
  <rect x="512" y="680" width="120" height="36" rx="18" fill="#F3D9B8"/>
</svg>
