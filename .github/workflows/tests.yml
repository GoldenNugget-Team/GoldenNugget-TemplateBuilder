name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'   # catches GoldenNugget changing its template rules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PySide6 ${{ matrix.pyside }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 6.9.3 is what the macOS release ships (requirements-macos.txt).
        pyside: ['6.9.3', 'latest']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          if [ "${{ matrix.pyside }}" = latest ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install "PySide6-Essentials==${{ matrix.pyside }}"
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  goldennugget:
    name: Same rules as GoldenNugget main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      GOLDENNUGGET_DIR: ${{ github.workspace }}/goldennugget
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: GoldenNugget-Team/GoldenNugget
          ref: main
          path: goldennugget

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3

      - name: Install GoldenNugget's dependencies
        run: python -m pip install -r goldennugget/requirements.txt

      - name: Load templates with GoldenNugget
        run: python -m unittest tests.test_goldennugget -v
