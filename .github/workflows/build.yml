name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      replace_linux_in:
        description: 'Release tag whose Linux archive to rebuild from that tag and replace (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal2 (DMG and ZIP)
    if: inputs.replace_linux_in == ''
    runs-on: macos-26
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5

      # The python.org installer is universal2; PyInstaller can only build a
      # Universal2 app from a universal2 interpreter.
      - name: Install universal Python 3.13
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/python.pkg" \
            https://www.python.org/ftp/python/3.13.16/python-3.13.16-macos11.pkg
          pkgutil --check-signature "$RUNNER_TEMP/python.pkg"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 -m venv .env
          echo "$GITHUB_WORKSPACE/.env/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-macos.txt
          python -m pip check
          python -m pip freeze > macOS-dependencies.txt

      - name: Build Universal2, validate and package DMG
        run: |
          python tools/build_macos.py
          cp macOS-dependencies.txt dist/
          QT_QPA_PLATFORM=offscreen "dist/Batter Builder.app/Contents/MacOS/Batter Builder" --smoke > smoke.log 2>&1
          cat smoke.log
          grep -q 'BATTER_SMOKE_OK' smoke.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: BatterBuilder-macOS-diagnostics
          path: |
            dist/macOS-validation.json
            dist/macOS-validation.stderr.log
            macOS-dependencies.txt
            smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v6
        with:
          name: BatterBuilder-macOS-Universal2
          path: |
            dist/BatterBuilder-macOS-Universal2.dmg
            dist/BatterBuilder-macOS-Universal2.zip
            dist/macOS-validation.json
            dist/SHA256SUMS-macOS.txt
            dist/macOS-dependencies.txt
          if-no-files-found: error

  test-macos:
    needs: build-macos
    name: Smoke test macOS ${{ matrix.arch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: BatterBuilder-macOS-Universal2
          path: artifacts

      - name: Install Rosetta
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Test the app from the DMG
        env:
          QT_QPA_PLATFORM: offscreen
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          cd artifacts
          shasum -a 256 -c SHA256SUMS-macOS.txt
          hdiutil verify BatterBuilder-macOS-Universal2.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg" BatterBuilder-macOS-Universal2.dmg
          ditto "$RUNNER_TEMP/dmg/Batter Builder.app" "$RUNNER_TEMP/Batter Builder.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/Batter Builder.app"
          arch "-${{ matrix.arch }}" "$RUNNER_TEMP/Batter Builder.app/Contents/MacOS/Batter Builder" --smoke > smoke.log 2>&1
          cat smoke.log
          grep -q 'BATTER_SMOKE_OK' smoke.log

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: BatterBuilder-Windows
          - os: ubuntu-latest
            name: BatterBuilder-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.replace_linux_in || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --name "Batter Builder" --icon assets/icon.ico \
            --add-data "batter_builder/ui/icons:batter_builder/ui/icons" \
            --add-data "assets/icon.png:assets" --add-data "assets/icon-small.svg:assets" \
            --collect-submodules batter_builder --collect-submodules awesomeui main.py

      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          BATTER_SMOKE_OUT: ${{ github.workspace }}/smoke.log
        run: |
          "dist/Batter Builder/Batter Builder" --smoke || true
          cat smoke.log
          grep -q 'BATTER_SMOKE_OK' smoke.log

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.name }}.zip" "Batter Builder"
          else
            # Store the files the PyInstaller symlinks point to, not the links:
            # many archive tools write a link as a small text file, and the app
            # then fails with "libQt6….so.6: file too short".
            zip -qr "../${{ matrix.name }}.zip" "Batter Builder"
          fi

      - name: Test the archive as people unpack it
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          BATTER_SMOKE_OUT: ${{ github.workspace }}/archive-smoke.log
        run: |
          # Python's zipfile ignores symlinks, like many archive managers.
          python - <<'PY'
          import os, stat, zipfile
          with zipfile.ZipFile("${{ matrix.name }}.zip") as archive:
              links = [i.filename for i in archive.infolist() if stat.S_ISLNK(i.external_attr >> 16)]
              assert not links, f"symlinks in the archive: {links[:5]}"
              for info in archive.infolist():
                  path = archive.extract(info, "unpacked")
                  mode = info.external_attr >> 16
                  if mode:
                      os.chmod(path, stat.S_IMODE(mode))
          PY
          "unpacked/Batter Builder/Batter Builder" --smoke || true
          cat archive-smoke.log
          grep -q 'BATTER_SMOKE_OK' archive-smoke.log

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-macos, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Batter Builder ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" --clobber \
            artifacts/BatterBuilder-macOS-Universal2.dmg \
            artifacts/BatterBuilder-macOS-Universal2.zip \
            artifacts/SHA256SUMS-macOS.txt \
            artifacts/BatterBuilder-Windows.zip \
            artifacts/BatterBuilder-Linux.zip

  replace-linux:
    name: Replace a release's Linux archive
    if: inputs.replace_linux_in != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: BatterBuilder-Linux

      - name: Upload over the release's copy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.replace_linux_in }}
        run: gh release upload "$TAG" --clobber BatterBuilder-Linux.zip
