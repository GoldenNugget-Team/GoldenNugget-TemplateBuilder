name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: BatterBuilder-Windows
          - os: macos-latest
            name: BatterBuilder-macOS
          - os: ubuntu-latest
            name: BatterBuilder-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --name "Batter Builder" \
            --collect-submodules batter_builder --collect-submodules awesomeui main.py

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.name }}.zip" "Batter Builder"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "Batter Builder.app" "../${{ matrix.name }}.zip"
          else
            zip -qry "../${{ matrix.name }}.zip" "Batter Builder"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Batter Builder ${GITHUB_REF_NAME#v}" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.name }}.zip" --clobber
